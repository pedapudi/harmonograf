[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmonograf-server"
version = "0.0.1"
description = "Harmonograf server: gRPC fan-in for multi-agent telemetry and control."
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
    "aiosqlite>=0.20",
    "intervaltree>=3.1",
    "rich>=13.7",
    "sonora>=0.2.2",
    "hypercorn>=0.17",
    "goldfive",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
harmonograf-server = "harmonograf_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harmonograf_server"]
# Ship the built console SPA inside the wheel so `pip/uv install
# harmonograf-server` carries the UI with no separate frontend build on the
# consumer's side. `make console` refreshes the checked-in bundle from the
# frontend source; checking it in is required because git-subdirectory
# consumers cannot run a build rooted in the sibling frontend directory.
# static_site.py locates it at runtime via importlib.resources.
artifacts = ["harmonograf_server/_console/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
